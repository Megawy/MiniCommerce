# Serves the compiled Angular app (single-page application). The API is not proxied here:
# the browser calls Django directly at http://localhost:8000/api (CORS allows this origin).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed bundles (main-ABC123.js, styles-XYZ.css) never change: cache for a year.
    # A missing file is a real 404 — it must not fall back to index.html.
    location ~* \.(?:js|css|woff2?|ico|png|svg|webp|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes (/products/7, /cart, /orders) fall back to index.html; Angular's router
    # takes over. index.html is revalidated on every load, so a new deployment shows up at once.
    # (add_header in a location replaces server-level ones, so the security headers live here.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
